name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu --prefer-binary -r requirements.txt
          python -m pip install ruff
          python -m pip install -e .

      - name: Run Ruff
        run: python -m ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu --prefer-binary -r requirements.txt
          python -m pip install ruff
          python -m pip install -e .

      - name: Run pipeline tests
        env:
          PYTHONPATH: .
          EXPLAINABLE_MULTIMODAL_FUSION_FOR_INDIAN_STOCK_MARKET_ALLOW_UNSIGNED: "1"
        run: pytest tests/test_pipeline.py -v

  artifact-integrity:
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu --prefer-binary -r requirements.txt
          python -m pip install ruff
          python -m pip install -e .

      - name: Verify artifact hashes
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          artifacts = [
              Path("models/xgboost/saved/xgb_model.pkl"),
              Path("models/lstm/saved/lstm_model.pt"),
          ]

          for artifact in artifacts:
              sidecar = artifact.with_suffix(artifact.suffix + ".sha256")
              expected = sidecar.read_text(encoding="utf-8").strip().split()[0]
              actual = sha256(artifact.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f"SHA-256 mismatch for {artifact}: expected {expected}, got {actual}"
                  )
          PY

  docker:
    runs-on: ubuntu-latest
    needs:
      - test
      - artifact-integrity
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Docker image
        run: docker build -t explainable-multimodal-fusion-for-indian-stock-market .
